<!doctype html>
<html lang="en">
<head>
{{HEAD}}
<title>Material Moodboard — MK Art Concepts, Solapur</title>
<meta name="description" content="Brass, jaali, velvet, leather, handmade tile, timber and light — explore the materials behind MK Art Concepts interiors.">
</head>
<body class="mood-page">
{{NAV}}
<main id="main">
  <div class="mood-ui">
    <div class="mood-title">
      <span class="label">Material library</span>
      <h1 class="display">The <em>moodboard.</em></h1>
      <p>Drag the board to look around. Pick a material to highlight every room it was used in. Click any photo to enlarge it.</p>
      <span class="mood-count" id="moodCount"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="board-viewport" id="viewport" data-cursor="DRAG"><div class="board" id="board"></div></div>
  <div class="mood-hint"><span>Drag · scroll · or use arrow keys</span><button id="recenter">Recenter</button><a href="index.html#work" style="text-decoration:underline;text-underline-offset:3px">Projects</a></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/materials.js"></script>
</body>
</html>
