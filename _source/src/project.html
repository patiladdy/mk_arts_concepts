<!doctype html>
<html lang="en">
<head>
{{HEAD}}
<title>Project — MK Art Concepts</title>
<meta name="description" content="Interior project by MK Art Concepts, Solapur.">
<meta property="og:image" content="assets/img/hero-day.webp">
</head>
<body id="top" class="has-hero">
{{NAV}}
<main id="main">
  <section class="p-hero" id="pHero">
    <div class="hero-layer hero-photo"><img id="pPhoto" alt=""></div>
    <div class="hero-layer hero-sketch" aria-hidden="true"><img id="pSketch" alt=""></div>
    <div class="hero-shade"></div>
    <span class="hero-tag t1">Reality</span>
    <span class="hero-tag t2">The sketch</span>
    <div class="hero-handle"><button aria-label="Drag to compare sketch and finished room" data-cursor="DRAG">DRAG</button></div>
    <div class="hero-copy">
      <span class="label" id="pKind">Project</span>
      <h1 class="display" id="pTitle">Project</h1>
    </div>
    <div class="hero-meta"><span class="mono" id="pNoMeta"></span><span class="mono">MK Art Concepts · Solapur</span></div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <section class="section wrap">
    <div class="p-intro">
      <span class="chapter-no rv" id="pNo">01</span>
      <p class="lede rv" id="pLede"></p>
      <dl class="spec rv" id="pSpec"></dl>
    </div>
  </section>

  <nav class="space-nav" id="spaceNav" aria-label="Spaces in this project"></nav>
  <div class="wrap" id="spaces"></div>

  <a class="next-proj" id="nextProj" href="#" data-cursor="NEXT">
    <img id="nextImg" alt="" loading="lazy">
    <div class="in-copy"><span class="label">Next project</span><h2 class="display" id="nextTitle"></h2></div>
  </a>
</main>
{{FOOT}}
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/project.js"></script>
</body>
</html>
